server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service. NO trailing slash on
    # `proxy_pass` so the `/api` prefix is preserved — the backend listens
    # on `/api/*` (see Back/src/routes/*.js). With a trailing slash nginx
    # would strip the prefix and the backend would answer 404 for every route.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # SPA fallback: anything that isn't /api/* falls through to index.html
    # so React Router routes survive a page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
