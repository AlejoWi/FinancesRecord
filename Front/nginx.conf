# nginx config for the FinancesRecord SPA.
# - Serves the Vite build output from /usr/share/nginx/html.
# - Falls back to /index.html for any unknown route so React Router works on refresh.
# - index.html is sent with no-cache so deployments are picked up immediately.
# - Hashed assets under /assets/ get a long-lived cache header.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sensible defaults: gzip text assets, hide server token.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    server_tokens off;

    # index.html must always be revalidated so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        expires off;
        try_files $uri =404;
    }

    # Hashed assets emitted by Vite under /assets/ are safe to cache long-term.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback: any unknown path is served as /index.html so React Router
    # can handle client-side routes like /expenses, /dashboard, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache nginx error pages.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }
}
