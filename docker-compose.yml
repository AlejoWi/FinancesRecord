services:
  frontend:
    build:
      context: Front
      dockerfile: Dockerfile
    image: financesrecord-frontend:local
    container_name: financesrecord-frontend
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: financesrecord-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finances_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-finances_db}
    volumes:
      - finances_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  finances_pgdata:
    name: finances_pgdata
