services:
  frontend:
    build:
      context: Front
      dockerfile: Dockerfile
    image: financesrecord-frontend:local
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: Back
      dockerfile: Dockerfile
    image: financesrecord-backend:local
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-finances_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-finances_db}
      NODE_ENV: production
      PORT: "3000"
      # COOKIE_SECRET is required in production; ops must inject it.
      # See Back/README.md for the generation command.
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be set in production. See Back/README.md.}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: financesrecord-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finances_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-finances_db}
    volumes:
      - finances_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  finances_pgdata:
    name: finances_pgdata
